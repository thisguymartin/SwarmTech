<!DOCTYPE html>
<html>
  <head>
    <title>SwarmTech - Disaster Response Coordination</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheets -->
    <link rel="stylesheet" type="text/css" href="css/app.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  </head>

  <body>
    <div id="main">
      <st-main></st-main>
    </div>

    <!-- Templates -->
    <template id="main-template">
      <div>
        <login v-if="!name" @name-set="setName"></login>
        <st-dashboard v-if="name" :name="name"></st-dashboard>
      </div>
    </template>

    <template id="login-template">
      <div class="login">
        <h2>SwarmTech</h2>
        <h3>Disaster Response Coordination</h3>
        <p>Please enter your name to join the coordination network.</p>

        <input class="login-input"
          type="text"
          v-model="name"
          @keyup.enter="setSessionName"
          placeholder="Your name"
          ref="loginInput" />

        <button v-on:click="setSessionName">Join Network</button>
      </div>
    </template>

    <template id="chat-box-template">
      <div class="chatbox">
        <pre v-if="debug" class="data-preview">
          <code>{{debugOutput}}</code>
        </pre>
        <div ref="history" class="history">
          <span class="chat">
            <span class="chat-author">System:</span>
            <span class="chat-message">Welcome, {{name}}! You are now connected to the coordination network.</span>
          </span>

          <span v-for="msg in history" :key="msg.timestamp" class="chat">
            <span class="chat-author">{{msg.name}}:</span>
            <span class="chat-message">{{msg.message}}</span>
          </span>
        </div>
        <div class="controls">
          <input
            ref="chatInput"
            class="chat-input"
            @keyup.enter="sendMessage"
            v-model="message"
            placeholder="Type a message..." />
          <button class="sendButton" @click="sendMessage">Send</button>
        </div>
      </div>
    </template>

    <template id="dashboard-template">
      <div class="dashboard">
        <div v-if="windowWidth > 900">
          <st-map :name="name"></st-map>
          <chat-box :name="name"></chat-box>
        </div>
        <div v-else>
          <st-map class="map_mobile" v-if="!toggleView"></st-map>
          <chat-box class="chat_mobile" :name="name" v-else></chat-box>
          <button class="mobile_toggle" @click="toggleButton">
            {{ toggleView ? 'Show Map' : 'Show Chat' }}
          </button>
        </div>
      </div>
    </template>

    <template id="map-template">
      <div id="map" class="map"></div>
    </template>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script src="js/chatBox.js"></script>
    <script src="js/map.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
