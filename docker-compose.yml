version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: swarmtech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: swarmtech
      POSTGRES_USER: swarmtech
      POSTGRES_PASSWORD: swarmtech123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmtech"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: swarmtech-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: swarmtech
      DB_USER: swarmtech
      DB_PASSWORD: swarmtech123
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  # Database Initializer (runs once)
  db-init:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: swarmtech-db-init
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: swarmtech
      DB_USER: swarmtech
      DB_PASSWORD: swarmtech123
    depends_on:
      db:
        condition: service_healthy
    command: npm run init-db
    restart: "no"

  # Frontend (Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: swarmtech-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
